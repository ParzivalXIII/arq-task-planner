# Alembic configuration for migrations

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(creation_date)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to datetime.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field in an autogenerated revision file
# (this is used when #AUTOGENERATE_COMMENT is used)
# truncate_slug_len = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Loggers to configure with individual handlers and formatters are
# given here; keys are names for them.
# The SQLAlchemy logger, "sqlalchemy.engine", should always be in this list;
# when omitted it falls back to logging.secondaryLogger and goes to ${ident}.log
# by default.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# the output encoding used when revision files
# are written from script.py.mako
# string value is passed to the encoding parameter of python's "unicode()" function
output_encoding = utf-8

sqlalchemy.url = driver://user:password@localhost/dbname
